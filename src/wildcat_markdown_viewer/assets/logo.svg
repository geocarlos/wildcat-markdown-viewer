  <ellipse cx="190" cy="246" rx="8" ry="28" fill="#1B1A1F"/>
  <circle cx="344" cy="226" r="13" fill="#1B1A1F"/>
  <circle cx="176" cy="228" r="7" fill="#fff"/>
  <circle cx="310" cy="216" r="8" fill="#fff"/>
  <!-- nose -->
  <path d="M238,298 L274,298 L256,318 Z" fill="#E8566B" stroke="#1B1A1F" stroke-width="8" stroke-linejoin="round"/>
  <!-- manic grin -->
  <path d="M172,330 Q256,430 344,322 Q256,358 172,330 Z" fill="#1B1A1F" stroke="#1B1A1F" stroke-width="10" stroke-linejoin="round"/>
  <path d="M290,372 Q312,412 286,420 Q262,416 272,378 Z" fill="#E8566B" stroke="#1B1A1F" stroke-width="7"/>
  <path d="M204,340 L226,346 L214,374 Z" fill="#fff"/>
  <path d="M304,338 L322,330 L316,360 Z" fill="#fff"/>
