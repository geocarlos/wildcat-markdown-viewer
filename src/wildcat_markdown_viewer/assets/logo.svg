  <g fill="none" stroke="#FFF4DA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="140,300 96,326 140,352"/>
    <polyline points="372,300 416,326 372,352"/>
    <line x1="402" y1="282" x2="384" y2="368" stroke-width="0"/>
